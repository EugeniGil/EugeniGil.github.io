# ==================================================
# academicpages MAIN CONFIGURATION
# ==================================================

# Site Settings
locale                   : "en-US"
title                    : "Eugeni Gil-Ocana"
title_separator          : "-"
name                     : &name "Eugeni Gil-Ocana"
description              : &description "Eugeni Gil-Ocana — PhD researcher in economics at the Universitat Politècnica de València. Public policy evaluation with causal inference, causal machine learning and explainable AI."
url                      : https://eugenigil.github.io   # full GitHub Pages URL
baseurl                  : ""                                   # leave empty if repo is username.github.io
repository               : "EugeniGil/EugeniGil.github.io"
google_scholar_stats_use_cdn : true
og_image                 : "og-image.jpg"   # social-preview card, /images/og-image.jpg
og_description           : "PhD researcher in economics at the Universitat Politècnica de València. Public policy evaluation with causal inference, causal machine learning and explainable AI."

# Site Author (sidebar info)
author:
  avatar           : "profile.jpg"            # file at /images/profile.jpg
  name             : *name
  pronoun          : null                      # e.g. "he/him", "she/her", "they/them"
  bio              : "PhD researcher in economics. Policy evaluation with causal inference and explainable machine learning."
  location         : "València, Spain"
  employer         : "Universitat Politècnica de València"
  uri              : null
  email            : "egiloca@doctor.upv.es"
  orcid            : "https://orcid.org/0009-0006-8921-8365"
  googlescholar    : "https://scholar.google.com/citations?user=iCdLpc8AAAAJ&hl=en"
  github           : "EugeniGil"
  linkedin         : "eugenio-gil-69a9a511b"   # username only - the theme prepends linkedin.com/in/
  twitter          : null
  researchgate     : null
  semantic         : null     # Semantic Scholar
  arxiv            : null
  wikipedia        : null
  bluesky          : null
  mastodon         : null     # full URL e.g. https://fosstodon.org/@username

# Publication category labels (used in publications page)
publication_category:
  books:
    title: 'Books'
    collection: publications
  manuscripts:
    title: 'Journal Articles'
    collection: publications
  working_papers:
    title: 'Working Papers'
    collection: publications
  conferences:
    title: 'Conference Papers'
    collection: publications

# Site Settings
teaser                   :                       # filename of teaser fallback teaser image placed in /images/
breadcrumbs              : false                 # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled"            # if enabled, adds "Read more" links to excerpts
talkmap_link             : false                 # show link to talkmap on talks page

# Comments
comments:
  provider               :                       # false (default), "disqus", "discourse", "facebook", "staticman", "custom"

# Analytics
analytics:
  provider               :  false                # false (default), "google", "google-universal", "custom"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/manifest.json
  - assets/manifest.yml
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Madrid

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
